[package]
name = "cnac"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cql2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Maintained fork of serde_yaml, which was archived in 2024.
serde_norway = "0.9"
thiserror = "2"
# Drops arrow (the larger size win), base64 and simdutf8 as well as the
# compression codecs. We only read the footer thrift, which is never
# compressed. Reading page headers or dictionary pages would need codecs
# back.
parquet = { version = "59.3", default-features = false }
tiff = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# wasm32 has no default entropy source, so getrandom needs a backend chosen
# explicitly. ahash (reached via both parquet and cql2 -> jsonschema) depends
# on getrandom without enabling wasm_js, and only a crate that declares a
# dependency can turn its features on -- hence the direct declaration here,
# which feature unification then applies to ahash's copy.
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
