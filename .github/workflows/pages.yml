name: Deploy demo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy; queue behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - name: Build wasm
        run: wasm-pack build --release --target web --out-dir web/pkg

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          # The samples are NOT deployed here. They live on Source Cooperative,
          # because Pages applies Range after gzip and because a cross-origin
          # object exercises the CORS preflight a same-origin one would not.
          # See the SOURCE_COOP note in web/catalog.js.

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Pages applies Range AFTER gzip, so a ranged request against a compressed
  # type returns a slice of the COMPRESSED stream with a Content-Range against
  # the compressed length. Browsers always send Accept-Encoding: gzip and it is
  # a Fetch-forbidden header, so this cannot be worked around from JS.
  # Pages does not compress octet-stream, tiff or wasm today -- but that is one
  # MIME-database change away from silently breaking Live mode, so assert it.
  verify-hosting:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert range support and no compression on binary assets
        env:
          URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -uo pipefail
          fail=0
          check() {
            local path="$1"
            local url="${URL%/}/$path"
            # -L: a custom domain redirects, and the redirect target is what a
            # browser actually fetches. Checking the pre-redirect response
            # verifies the wrong server.
            local code
            code=$(curl -sSL -o /dev/null -w '%{http_code}' "$url")
            if [ "$code" = "404" ]; then
              echo "skip $path (404, not published yet)"
              return 0
            fi
            if [ "$code" != "200" ]; then
              # Anything else is unexpected and must not pass silently.
              echo "  FAIL: $path returned HTTP $code"
              fail=1
              return 0
            fi
            echo "checking $path"
            local hdrs
            hdrs=$(curl -sSIL "$url")
            # A warning, not a failure. Cloudflare serves ranges correctly for
            # cached assets without advertising Accept-Ranges on the plain 200.
            # The 206 below is the property that actually matters; some readers
            # probe this header first, so it is still worth surfacing.
            grep -qi '^accept-ranges: bytes' <<<"$hdrs" \
              || echo "  warn: no accept-ranges: bytes (ranges may still work)"
            if grep -qi '^content-encoding:' <<<"$hdrs"; then
              echo "  FAIL: served compressed; a range would slice the compressed stream"
              fail=1
            fi
            # The load-bearing assertion. An intermediary that ignores Range
            # returns 200 with the ENTIRE representation (RFC 9110 s14.2),
            # which is exactly the disclosure this project exists to prevent
            # and would silently break the demo's Live mode.
            local rhdrs
            rhdrs=$(curl -sSIL -H 'Range: bytes=0-19' "$url")
            if ! grep -qiE '^HTTP/[0-9.]+ 206' <<<"$rhdrs"; then
              echo "  FAIL: ranged request did not return 206:"
              grep -iE '^HTTP/|^content-range|^server' <<<"$rhdrs" | sed 's/^/    /'
              fail=1
            fi
          }
          if [ -z "${URL:-}" ]; then
            echo "FAIL: no page_url from the deploy job"
            exit 1
          fi
          # GitHub reports an http:// URL because Cloudflare terminates TLS,
          # so Pages never provisions a certificate and https_enforced cannot
          # be set. HTTPS works through Cloudflare, and the demo must use it:
          # an https page cannot fetch http assets.
          URL="https://${URL#http://}"
          echo "base URL: $URL"
          check "pkg/cnac_bg.wasm"

          # The samples are hosted elsewhere, so check them where they actually
          # are. This is the assertion that matters most now: the demo depends
          # on a third party continuing to serve ranges and CORS, and if that
          # changes the page breaks in a way that looks like a bug in this
          # repository.
          SC="https://data.source.coop/alukach/alukach-experimentation/cloud-native-access-control"
          for f in paris-landmarks.tif nyc-taxi-8rg.parquet s2-tci-512.tif; do
            echo "checking $SC/$f"
            hdrs=$(curl -sS -o /dev/null -D- -m 30 \
              -H 'Range: bytes=0-19' \
              -H 'Origin: https://example.org' \
              -H 'Accept-Encoding: gzip' "$SC/$f")
            grep -qiE '^HTTP/[0-9.]+ 206' <<<"$hdrs" || {
              echo "  FAIL: no 206"; grep -iE '^HTTP/|^content-range' <<<"$hdrs" | sed 's/^/    /'; fail=1; }
            grep -qi '^content-encoding:' <<<"$hdrs" && {
              echo "  FAIL: served compressed; a range would slice the compressed stream"; fail=1; }
            grep -qi '^access-control-allow-origin:' <<<"$hdrs" || {
              echo "  FAIL: no CORS header; a browser cannot read this"; fail=1; }
          done
          exit $fail
