name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the exact compiler and installs the
      # wasm32 target. The pin is load-bearing: bundle size is a recorded
      # finding and moves across compiler releases from codegen alone.
      - run: rustup show

      - uses: Swatinem/rust-cache@v2

      # The samples are hosted, not committed. Fetching them is not optional:
      # every test that reads a real file would otherwise fail, and the whole
      # point of those tests is that they run against artefacts other tools
      # produced rather than against synthetic bytes. The script verifies a
      # pinned SHA-256, so a sample that changed upstream fails here rather
      # than quietly invalidating the numbers in docs/findings.md.
      - name: Fetch sample data
        run: ./scripts/fetch-data.sh

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (debug)
        run: cargo test

      # The Range parser had an integer overflow that panicked in debug and
      # silently wrapped in release. Both profiles get run for that reason.
      - name: Test (release)
        run: cargo test --release

      - name: Build for wasm32
        run: cargo build --release --target wasm32-unknown-unknown
